name: validate

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: print workflow data
        uses: hwrok/print-workflow-data@acc0af61385ab26f5a83f809f6e2466b5d0832fd # v1.2.3

      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: setup bats
        id: setup
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # 4.0.0
        with:
          bats-version: 1.14.0
          github-token: ${{ github.token }}
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: syntax
        if: always() && steps.setup.outcome == 'success'
        run: tests/run syntax

      - name: lint
        if: always() && steps.setup.outcome == 'success'
        run: |
          command -v shellcheck >/dev/null || brew install shellcheck
          tests/run lint

      - name: bats
        if: always() && steps.setup.outcome == 'success'
        run: |
          mkdir -p "$RUNNER_TEMP/bats"
          tests/run bats --report-formatter junit --output "$RUNNER_TEMP/bats"

      - name: report
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: mikepenz/action-junit-report@v6.5.0
        with:
          report_paths: ${{ runner.temp }}/bats/*.xml
          annotate_only: true
          detailed_summary: true

      - name: upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: bats-report-${{ matrix.os }}
          path: ${{ runner.temp }}/bats/
          retention-days: 7
          if-no-files-found: ignore
